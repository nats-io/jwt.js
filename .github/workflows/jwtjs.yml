name: CI

on:
  push:
    tags:
      - "*"
    branches:
      - "*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        deno-version: [2.9.x]
    environment: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Use Deno Version ${{ matrix.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - name: Get nsc
        run: |
          wget "https://github.com/nats-io/nsc/releases/latest/download/nsc-linux-amd64.zip" -O tmp.zip
          unzip tmp.zip
      - name: Run Tests
        run: deno test --allow-all --fail-fast --coverage=./cov
